name: Deploy to GitHub Pages

on:
  push:
    branches:
      - 'claude/polymarket-war-analysis-0MUfz'
    paths:
      - 'dashboard.html'
      - 'crypto_dashboard.html'
      - 'data/war_data.json'
      - 'data/crypto_data.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/polymarket-war-analysis-0MUfz

      - name: Build site
        run: |
          mkdir _site
          python3 - <<'PYEOF'
          import json, re, os

          # ── War dashboard → index.html ──────────────────────────────
          try:
              with open('data/war_data.json') as f:
                  war_data = json.load(f)
          except Exception:
              war_data = {}

          with open('dashboard.html') as f:
              war_html = f.read()

          if war_data:
              injected = f'window.__EMBEDDED__ = {json.dumps(war_data, separators=(",", ":"))};'
              war_html = re.sub(r'window\.__EMBEDDED__\s*=\s*\{.*?\};', injected, war_html, flags=re.DOTALL)

          with open('_site/index.html', 'w') as f:
              f.write(war_html)

          # ── Crypto dashboard → crypto.html ──────────────────────────
          try:
              with open('data/crypto_data.json') as f:
                  crypto_data = json.load(f)
          except Exception:
              crypto_data = {}

          with open('crypto_dashboard.html') as f:
              crypto_html = f.read()

          if crypto_data:
              injected = f'window.__EMBEDDED__ = {json.dumps(crypto_data, separators=(",", ":"))};'
              crypto_html = re.sub(r'window\.__EMBEDDED__\s*=\s*\{.*?\};', injected, crypto_html, flags=re.DOTALL)

          with open('_site/crypto.html', 'w') as f:
              f.write(crypto_html)

          print(f"Built index.html ({os.path.getsize('_site/index.html')//1024} KB) "
                f"and crypto.html ({os.path.getsize('_site/crypto.html')//1024} KB)")
          PYEOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

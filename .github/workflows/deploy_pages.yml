name: Deploy to GitHub Pages

on:
  push:
    branches:
      - 'claude/polymarket-war-analysis-0MUfz'
    paths:
      - 'dashboard.html'
      - 'data/war_data.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/polymarket-war-analysis-0MUfz

      - name: Build self-contained index.html
        run: |
          mkdir _site
          python3 - <<'PYEOF'
          import json, re
          with open('data/war_data.json') as f:
              data = json.load(f)
          with open('dashboard.html') as f:
              html = f.read()
          injected = f'window.__EMBEDDED__ = {json.dumps(data, separators=(",", ":"))};'
          html = re.sub(r'window\.__EMBEDDED__\s*=\s*\{.*?\};', injected, html, flags=re.DOTALL)
          with open('_site/index.html', 'w') as f:
              f.write(html)
          PYEOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

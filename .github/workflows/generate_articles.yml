name: Generate BilNytt articles

on:
  schedule:
    # Varje dag kl 06:00 UTC (~08:00 svensk sommartid)
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      agent:
        description: 'Agent (nyheter/elbilar/tester/motorsport/kopguide/klassiker)'
        required: false
        default: ''
        type: string
      topic:
        description: 'Ämne / rubrik (för manuell körning)'
        required: false
        default: ''
        type: string
      source_url:
        description: 'Valfri käll-URL'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: generate-articles
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: claude/review-website-appearance-PlgWC
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate articles
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.agent }}" ] && [ -n "${{ inputs.topic }}" ]; then
            python scripts/generate_articles.py \
              --mode manual \
              --agent "${{ inputs.agent }}" \
              --topic "${{ inputs.topic }}" \
              ${{ inputs.source_url && format('--url "{0}"', inputs.source_url) || '' }}
          else
            python scripts/generate_articles.py --mode scheduled
          fi

      - name: Commit generated articles to feature branch
        run: |
          git config user.name  "bilnytt-bot[bot]"
          git config user.email "bilnytt-bot@users.noreply.github.com"
          git add carnews/articles carnews/data/articles.json
          if git diff --staged --quiet; then
            echo "Inga nya artiklar."
            exit 0
          fi
          git commit -m "content: auto-gen artiklar $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push origin claude/review-website-appearance-PlgWC

      - name: Deploy to gh-pages
        run: |
          git fetch origin gh-pages
          git worktree add /tmp/ghp gh-pages
          rm -rf /tmp/ghp/carnews
          cp -r carnews /tmp/ghp/carnews
          cd /tmp/ghp
          git add carnews
          if git diff --staged --quiet; then
            echo "Inga ändringar till gh-pages."
            exit 0
          fi
          git commit -m "deploy: publish carnews update $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push origin gh-pages

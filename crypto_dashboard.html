<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Polymarket Crypto Wallet Tracker — BTC · ETH · SOL</title>
<style>
  :root {
    --bg:      #080b10;
    --surface: #0f1318;
    --border:  #1a2235;
    --border2: #243048;
    --text:    #e2e8f0;
    --muted:   #64748b;
    --green:   #22c55e;
    --red:     #ef4444;
    --yellow:  #eab308;
    --blue:    #3b82f6;
    --purple:  #a855f7;
    --accent:  #0ea5e9;
    --glow:    rgba(14,165,233,.12);
    --btc:     #f7931a;
    --eth:     #627eea;
    --sol:     #9945ff;
    --btc-glow: rgba(247,147,26,.15);
    --eth-glow: rgba(98,126,234,.15);
    --sol-glow: rgba(153,69,255,.15);
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'SF Mono','Fira Code','Cascadia Code',monospace;
    font-size:13px;
    min-height:100vh;
  }

  /* ── Header ── */
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 24px;
    background:var(--surface);
    border-bottom:1px solid var(--border);
    position:sticky; top:0; z-index:100;
  }
  .header-left{ display:flex; align-items:center; gap:16px; }
  .logo{ font-size:15px; font-weight:700; letter-spacing:-.5px; }
  .logo .btc{ color:var(--btc); }
  .logo .eth{ color:var(--eth); }
  .logo .sol{ color:var(--sol); }
  .logo .dot{ color:var(--muted); }
  .status-dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--green); box-shadow:0 0 6px var(--green);
    animation:pulse 2s infinite; display:inline-block;
  }
  .status-dot.loading{ background:var(--yellow); box-shadow:0 0 6px var(--yellow); }
  .status-dot.error  { background:var(--red);    box-shadow:0 0 6px var(--red); animation:none; }
  @keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.4} }
  .header-right{ display:flex; align-items:center; gap:16px; }
  #clock,#refresh-timer{ color:var(--muted); font-size:11px; }
  .btn{
    padding:5px 12px; border-radius:6px;
    border:1px solid var(--border2); background:transparent;
    color:var(--accent); cursor:pointer; font:inherit; font-size:11px;
    transition:all .15s;
  }
  .btn:hover{ background:var(--glow); border-color:var(--accent); }

  /* ── Coin tabs ── */
  .coin-tabs{
    display:flex; gap:0;
    background:var(--surface);
    border-bottom:1px solid var(--border);
    padding:0 24px;
  }
  .coin-tab{
    padding:10px 20px; cursor:pointer; font:inherit; font-size:13px;
    border:none; background:transparent; color:var(--muted);
    border-bottom:2px solid transparent;
    transition:all .15s; display:flex; align-items:center; gap:8px;
  }
  .coin-tab .tab-icon{ font-size:15px; font-weight:700; }
  .coin-tab:hover{ color:var(--text); }
  .coin-tab.active-btc{ color:var(--btc); border-bottom-color:var(--btc); }
  .coin-tab.active-eth{ color:var(--eth); border-bottom-color:var(--eth); }
  .coin-tab.active-sol{ color:var(--sol); border-bottom-color:var(--sol); }
  .coin-tab .tab-count{
    font-size:10px; padding:1px 5px;
    border-radius:10px; background:var(--border2); color:var(--muted);
  }

  /* ── Layout ── */
  .app{ display:grid; grid-template-columns:240px 1fr; min-height:calc(100vh - 95px); }

  /* ── Sidebar ── */
  aside{
    background:var(--surface); border-right:1px solid var(--border);
    padding:14px; display:flex; flex-direction:column; gap:16px;
    position:sticky; top:95px; height:calc(100vh - 95px); overflow-y:auto;
  }
  .stat-card{
    background:var(--bg); border:1px solid var(--border);
    border-radius:8px; padding:12px;
  }
  .stat-card h4{ font-size:10px; color:var(--muted); text-transform:uppercase;
                 letter-spacing:.5px; margin-bottom:8px; }
  .stat-row{ display:flex; justify-content:space-between; align-items:center;
             margin-bottom:5px; }
  .stat-label{ color:var(--muted); font-size:11px; }
  .stat-val{ font-size:12px; font-weight:600; }
  .green{ color:var(--green); }
  .red  { color:var(--red);   }
  .yellow{ color:var(--yellow); }
  .blue { color:var(--blue);  }
  .muted{ color:var(--muted); }
  .btc-c{ color:var(--btc); }
  .eth-c{ color:var(--eth); }
  .sol-c{ color:var(--sol); }

  .nav-section h5{ font-size:10px; color:var(--muted); text-transform:uppercase;
                   letter-spacing:.5px; margin-bottom:8px; }
  .nav-link{
    display:block; padding:7px 10px; border-radius:6px;
    color:var(--muted); text-decoration:none; font-size:12px;
    cursor:pointer; transition:all .15s; margin-bottom:2px;
    border:none; background:none; width:100%; text-align:left;
  }
  .nav-link:hover{ background:var(--border); color:var(--text); }
  .nav-link.active{ color:var(--accent); background:var(--glow); }

  /* ── Main ── */
  main{ padding:20px 24px; display:flex; flex-direction:column; gap:20px; }

  /* ── Section ── */
  .section{
    background:var(--surface); border:1px solid var(--border);
    border-radius:10px; overflow:hidden;
  }
  .section-header{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 16px; border-bottom:1px solid var(--border);
    cursor:pointer; user-select:none;
  }
  .section-title{
    display:flex; align-items:center; gap:10px;
    font-size:13px; font-weight:600;
  }
  .section-title .icon{ font-size:14px; }
  .section-badge{
    font-size:10px; padding:2px 7px; border-radius:10px;
    background:var(--border2); color:var(--muted);
  }
  .section-body{ padding:16px; }
  .collapsed .section-body{ display:none; }
  .chevron{ color:var(--muted); font-size:11px; transition:transform .2s; }
  .collapsed .chevron{ transform:rotate(-90deg); }

  /* ── Coin banner ── */
  .coin-banner{
    display:flex; align-items:center; gap:14px;
    padding:14px 16px; border-radius:8px;
    margin-bottom:16px; border:1px solid;
  }
  .coin-banner.BTC{ background:var(--btc-glow); border-color:rgba(247,147,26,.3); }
  .coin-banner.ETH{ background:var(--eth-glow); border-color:rgba(98,126,234,.3);  }
  .coin-banner.SOL{ background:var(--sol-glow); border-color:rgba(153,69,255,.3);  }
  .coin-banner .big-icon{ font-size:28px; font-weight:900; }
  .coin-banner.BTC .big-icon{ color:var(--btc); }
  .coin-banner.ETH .big-icon{ color:var(--eth); }
  .coin-banner.SOL .big-icon{ color:var(--sol); }
  .coin-banner-info h2{ font-size:16px; font-weight:700; }
  .coin-banner-info p { font-size:11px; color:var(--muted); margin-top:2px; }
  .coin-stats{ margin-left:auto; display:flex; gap:20px; }
  .cs-item{ text-align:right; }
  .cs-item .val{ font-size:14px; font-weight:600; }
  .cs-item .lbl{ font-size:10px; color:var(--muted); }

  /* ── Table ── */
  .tbl-wrap{ overflow-x:auto; }
  table{ width:100%; border-collapse:collapse; font-size:12px; }
  th{ padding:7px 10px; text-align:left; font-size:10px; color:var(--muted);
      text-transform:uppercase; letter-spacing:.4px; white-space:nowrap;
      border-bottom:1px solid var(--border); }
  td{ padding:7px 10px; border-bottom:1px solid var(--border);
      vertical-align:middle; white-space:nowrap; }
  tr:last-child td{ border-bottom:none; }
  tr:hover td{ background:rgba(255,255,255,.02); }

  /* ── Market pill ── */
  .market-pill{
    display:inline-block; padding:3px 8px;
    border-radius:20px; font-size:10px; font-weight:600;
  }
  .pill-open  { background:rgba(34,197,94,.15);  color:var(--green); }
  .pill-closed{ background:rgba(107,114,128,.15); color:var(--muted); }

  /* ── Price bar ── */
  .price-bar-wrap{ width:80px; }
  .price-bar{
    height:4px; border-radius:2px; margin-top:3px;
    background:var(--border2);
  }
  .price-bar-fill{ height:100%; border-radius:2px; }

  /* ── Signal card ── */
  .signal-grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
    gap:12px;
  }
  .signal-card{
    background:var(--bg); border:1px solid var(--border);
    border-radius:8px; padding:14px; position:relative; overflow:hidden;
  }
  .signal-card::before{
    content:''; position:absolute; top:0; left:0; right:0;
    height:2px;
  }
  .signal-card.multi_period::before{ background:var(--yellow); }
  .signal-card.top50::before       { background:var(--accent); }
  .signal-card.exit-sig::before    { background:var(--red);    }
  .sig-top{ display:flex; align-items:flex-start; justify-content:space-between;
             gap:8px; margin-bottom:10px; }
  .sig-title{
    font-size:12px; font-weight:600; line-height:1.4;
    overflow:hidden; display:-webkit-box; -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
  }
  .sig-badge{
    font-size:9px; padding:2px 6px; border-radius:10px;
    white-space:nowrap; flex-shrink:0;
  }
  .sig-badge.mp{ background:rgba(234,179,8,.2);  color:var(--yellow); }
  .sig-badge.t5{ background:rgba(14,165,233,.2); color:var(--accent); }
  .sig-badge.ex{ background:rgba(239,68,68,.2);  color:var(--red);    }
  .sig-metrics{
    display:grid; grid-template-columns:repeat(3,1fr);
    gap:8px; margin-bottom:10px;
  }
  .sig-m{ text-align:center; }
  .sig-m .val{ font-size:14px; font-weight:700; }
  .sig-m .lbl{ font-size:9px; color:var(--muted); margin-top:1px; }
  .sig-wallets{
    display:flex; flex-direction:column; gap:4px;
    border-top:1px solid var(--border); padding-top:8px;
  }
  .sig-w{ display:flex; align-items:center; justify-content:space-between; }
  .sig-w-addr{ font-size:10px; color:var(--muted); }
  .sig-w-addr a{
    color:inherit; text-decoration:none;
  }
  .sig-w-addr a:hover{ color:var(--accent); }
  .sig-w-stats{ display:flex; gap:6px; font-size:10px; }
  .sig-footer{
    margin-top:8px; display:flex; align-items:center;
    justify-content:space-between; font-size:10px; color:var(--muted);
  }
  .sig-alloc{
    padding:4px 8px; border-radius:4px;
    background:rgba(34,197,94,.12); color:var(--green);
    font-size:11px; font-weight:600;
  }
  .sig-link{
    color:var(--accent); text-decoration:none; font-size:10px;
  }
  .sig-link:hover{ text-decoration:underline; }

  /* ── Wallet row expandable ── */
  .wallet-expand-btn{
    background:none; border:none; color:var(--accent);
    cursor:pointer; font:inherit; font-size:10px; padding:0;
  }
  .wallet-detail{
    background:rgba(0,0,0,.3); border-radius:6px;
    padding:10px 12px; margin-top:4px; font-size:11px;
  }
  .wallet-detail table{ font-size:11px; }
  .wallet-detail td{ padding:4px 8px; }

  /* ── Age badge ── */
  .age-new{ color:var(--green); font-size:10px; }
  .age-old{ color:var(--muted); font-size:10px; }

  /* ── Empty state ── */
  .empty{
    text-align:center; padding:32px; color:var(--muted); font-size:12px;
  }
  .empty .icon{ font-size:24px; margin-bottom:8px; }

  /* ── Toast ── */
  #toast{
    position:fixed; bottom:20px; right:20px;
    background:var(--surface); border:1px solid var(--border2);
    border-radius:8px; padding:10px 16px; font-size:12px;
    box-shadow:0 4px 20px rgba(0,0,0,.4);
    transition:opacity .3s; opacity:0; pointer-events:none; z-index:200;
  }
  #toast.show{ opacity:1; }

  /* ── Scrollbar ── */
  ::-webkit-scrollbar{ width:5px; height:5px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:var(--border2); border-radius:3px; }

  @media(max-width:900px){
    .app{ grid-template-columns:1fr; }
    aside{ position:static; height:auto; }
    .coin-stats{ display:none; }
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="logo">
      <span class="btc">₿TC</span>
      <span class="dot"> · </span>
      <span class="eth">ΞTH</span>
      <span class="dot"> · </span>
      <span class="sol">◎SOL</span>
      <span style="color:var(--muted);font-weight:400"> Wallet Tracker</span>
    </div>
    <span class="status-dot" id="status-dot"></span>
    <span id="status-text" style="color:var(--muted);font-size:11px">Loading…</span>
  </div>
  <div class="header-right">
    <span id="clock"></span>
    <span id="refresh-timer"></span>
    <button class="btn" onclick="copyAllSignals()">Copy Signals</button>

</header>

<!-- Coin tabs -->
<div class="coin-tabs" id="coin-tabs">
  <button class="coin-tab" data-coin="BTC" onclick="switchCoin('BTC')">
    <span class="tab-icon" style="color:var(--btc)">₿</span> Bitcoin

</div>

<div class="app">
  <aside id="sidebar">
    <div class="stat-card" id="global-stats">
      <h4>Overview</h4>
      <div class="stat-row"><span class="stat-label">Generated</span>
        <span class="stat-val muted" id="gen-time">—</span></div>
      <div class="stat-row"><span class="stat-label">BTC Markets</span>
        <span class="stat-val btc-c" id="s-btc-markets">—</span></div>
      <div class="stat-row"><span class="stat-label">ETH Markets</span>
        <span class="stat-val eth-c" id="s-eth-markets">—</span></div>
      <div class="stat-row"><span class="stat-label">SOL Markets</span>
        <span class="stat-val sol-c" id="s-sol-markets">—</span></div>
    </div>
    <div class="stat-card" id="coin-stats-card">
      <h4 id="sidebar-coin-title">Coin Stats</h4>
      <div class="stat-row"><span class="stat-label">Open Markets</span>
        <span class="stat-val" id="s-open">—</span></div>
      <div class="stat-row"><span class="stat-label">Top Wallets</span>
        <span class="stat-val" id="s-wallets">—</span></div>
      <div class="stat-row"><span class="stat-label">MP Signals</span>
        <span class="stat-val yellow" id="s-mp-sig">—</span></div>
      <div class="stat-row"><span class="stat-label">Top50 Signals</span>
        <span class="stat-val blue" id="s-t50-sig">—</span></div>
      <div class="stat-row"><span class="stat-label">Exit Alerts</span>
        <span class="stat-val red"  id="s-exit">—</span></div>
    </div>
    <div class="nav-section">
      <h5>Sections</h5>
      <button class="nav-link" onclick="scrollTo('sec-signals')">Signals</button>
      <button class="nav-link" onclick="scrollTo('sec-exits')">Exit Alerts</button>
      <button class="nav-link" onclick="scrollTo('sec-markets')">Markets</button>
      <button class="nav-link" onclick="scrollTo('sec-mp')">Multi-Period Wallets</button>
      <button class="nav-link" onclick="scrollTo('sec-top50')">Top-50 Wallets</button>
    </div>
  </aside>

  <main id="main-content">
    <div id="coin-view"></div>
  </main>
</div>

<div id="toast"></div>

<script>
// ── Embedded data (injected at deploy; empty = load live) ────
window.__EMBEDDED__ = {};

// ── State ────────────────────────────────────────────────────
let DATA        = null;
let activeCoin  = 'BTC';
let refreshSecs = 90;
let refreshInterval, clockInterval, timerInterval;
let _liveLoading = false;

// ── API config ───────────────────────────────────────────────
const CORS_PROXIES = ['https://corsproxy.io/?','https://api.allorigins.win/raw?url='];
let _proxyIdx = 0;
const GAMMA   = 'https://gamma-api.polymarket.com';
const CLOB    = 'https://clob.polymarket.com';
const SUBGRAPH= 'https://api.thegraph.com/subgraphs/name/polymarket/matic-markets-5';

const COIN_CFG = {
  BTC: { keywords:['bitcoin','btc'],
         terms:['bitcoin price','btc price','bitcoin above','btc above','bitcoin 2026','btc 2026','bitcoin ath'],
         color:'#f7931a', icon:'₿' },
  ETH: { keywords:['ethereum','eth'],
         terms:['ethereum price','eth price','ethereum above','eth above','ethereum 2026','eth 2026'],
         color:'#627eea', icon:'Ξ' },
  SOL: { keywords:['solana','sol price','sol above'],
         terms:['solana price','sol price','solana above','solana 2026','sol 2026'],
         color:'#9945ff', icon:'◎' },
};

const MIN_TRADES   = 5;
const TOP_PROFIT   = 50;
const ACT_WINDOW   = 60;
const MIN_SIG_WALL = 2;
const SUCCESS_RATE = 0.82;
const BUDGET       = 100.0;
const PERIODS = {
  jun_2025:[1748736000,1751327999],
  feb_2026:[1769904000,1772323199],
  mar_2026:[1772323200,1775001599],
};
const REQ_PERIODS = new Set(['feb_2026','mar_2026']);

// ── Init ─────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  startClock();
  startRefreshTimer();
  // Fast initial render from embedded data if available
  if (window.__EMBEDDED__?.coins) {
    DATA = window.__EMBEDDED__;
    renderAll();
    setStatus('loading', 'Cached data — fetching live…');
  } else {
    setStatus('loading', 'Connecting to Polymarket…');
  }
  loadLive();  // always start live fetch
});

function setStatus(state, msg) {
  const dot  = document.getElementById('status-dot');
  const text = document.getElementById('status-text');
  dot.className = 'status-dot ' + (state === 'live' ? '' : state === 'loading' ? 'loading' : 'error');
  if (msg) text.textContent = msg;
}

function startClock() {
  const el = document.getElementById('clock');
  const tick = () => { el.textContent = new Date().toLocaleTimeString(); };
  tick(); clockInterval = setInterval(tick, 1000);
}

function startRefreshTimer() {
  const el = document.getElementById('refresh-timer');
  let secs = refreshSecs;
  timerInterval = setInterval(() => {
    secs--;
    el.textContent = `Refresh in ${secs}s`;
    if (secs <= 0) { secs = refreshSecs; loadLive(); }
  }, 1000);
}

// ── HTTP helpers ─────────────────────────────────────────────
async function apiFetch(url, opts = {}) {
  const isPost = opts.method === 'POST';
  const attempts = isPost ? [url, CORS_PROXIES[_proxyIdx]+encodeURIComponent(url)]
                          : [CORS_PROXIES[_proxyIdx]+encodeURIComponent(url), url];
  let lastErr;
  for (let i = 0; i < attempts.length; i++) {
    try {
      const r = await fetch(attempts[i], { ...opts, signal: AbortSignal.timeout(10000) });
      if (!r.ok) throw new Error('HTTP '+r.status);
      return await r.json();
    } catch(e) {
      lastErr = e;
      if (i === 0 && !isPost && _proxyIdx < CORS_PROXIES.length-1) _proxyIdx++;
    }
  }
  throw lastErr;
}

// ── Market fetching ──────────────────────────────────────────
async function fetchCoinMarkets(coin) {
  const cfg = COIN_CFG[coin];
  const seen = new Set(); const markets = [];
  const tasks = [];
  for (const term of cfg.terms)
    for (const closed of ['false','true'])
      tasks.push(apiFetch(`${GAMMA}/markets?q=${encodeURIComponent(term)}&closed=${closed}&limit=100`).catch(()=>null));
  const results = await Promise.allSettled(tasks);
  for (const r of results) {
    if (r.status !== 'fulfilled' || !r.value) continue;
    const batch = Array.isArray(r.value) ? r.value : (r.value.markets||[]);
    for (const m of batch) {
      const id    = m.conditionId || m.id;
      const text  = `${(m.question||m.title||'').toLowerCase()} ${(m.slug||'').toLowerCase()}`;
      if (!id || seen.has(id)) continue;
      if (cfg.keywords.some(kw => text.includes(kw))) { markets.push(m); seen.add(id); }
    }
  }
  return markets;
}

// ── Trade fetching ───────────────────────────────────────────
const GQL = `query T($conds:[String!]!,$skip:Int!){fpmmTrades(first:1000 skip:$skip where:{fpmm_in:$conds} orderBy:creationTimestamp orderDirection:desc){id type creator{id} fpmm{id} outcomeTokensTraded collateralAmount creationTimestamp}}`;

async function fetchTrades(conditionIds) {
  if (!conditionIds.length) return [];
  let all = [], skip = 0;
  while (true) {
    const res = await apiFetch(SUBGRAPH, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({query:GQL, variables:{conds:conditionIds, skip}})
    }).catch(()=>null);
    const trades = res?.data?.fpmmTrades || [];
    all.push(...trades);
    if (trades.length < 1000) break;
    skip += 1000;
  }
  return all;
}

async function fetchTradesCLOB(mids) {
  let all = [];
  for (let i = 0; i < Math.min(mids.length, 30); i += 6) {
    const batch = mids.slice(i, i+6);
    const results = await Promise.allSettled(batch.map(async mid => {
      const d = await apiFetch(`${CLOB}/trades?market=${mid}&limit=500`);
      const t = Array.isArray(d) ? d : (d.data||[]);
      t.forEach(x => x._market = mid); return t;
    }));
    for (const r of results) if (r.status==='fulfilled') all.push(...r.value);
  }
  return all;
}

// ── Wallet aggregation ────────────────────────────────────────
function tsPeriod(ts) {
  for (const [n,[s,e]] of Object.entries(PERIODS)) if (ts>=s&&ts<=e) return n;
  return null;
}
function newW() {
  return {trades:0,buys:0,sells:0,grossIn:0,grossOut:0,profitableExits:0,unprofitableExits:0,
          firstTrade:null,lastTrade:null,periodFlags:new Set(),periodPnl:{},positions:{}};
}
function tagPeriodC(w,ts,col,isBuy) {
  const p=tsPeriod(ts); if(!p) return;
  w.periodFlags.add(p);
  if(!w.periodPnl[p]) w.periodPnl[p]={grossIn:0,grossOut:0};
  if(isBuy) w.periodPnl[p].grossIn+=col; else w.periodPnl[p].grossOut+=col;
}
function updatePosC(w,mid,tok,cost,isBuy) {
  if(!mid) return;
  if(!w.positions[mid]) w.positions[mid]={netTokens:0,totalCost:0};
  const pos=w.positions[mid];
  if(isBuy) { pos.netTokens+=tok; pos.totalCost+=cost; }
  else {
    if(pos.netTokens>0) { const r=Math.min(tok/pos.netTokens,1); pos.totalCost-=pos.totalCost*r; }
    pos.netTokens=Math.max(0,pos.netTokens-tok);
  }
}
function aggregateSub(trades) {
  const ws = {};
  for (const t of trades) {
    const addr = t.creator?.id?.toLowerCase(); if(!addr) continue;
    if(!ws[addr]) ws[addr]=newW();
    const w=ws[addr]; w.trades++;
    const ts=parseInt(t.creationTimestamp||0), col=parseInt(t.collateralAmount||0)/1e6,
          tok=parseInt(t.outcomeTokensTraded||0)/1e6, mid=t.fpmm?.id||'', tp=(t.type||'').toUpperCase();
    if(!w.firstTrade||ts<w.firstTrade) w.firstTrade=ts;
    if(!w.lastTrade ||ts>w.lastTrade ) w.lastTrade=ts;
    if(tp==='BUY') { w.buys++;w.grossIn+=col;  tagPeriodC(w,ts,col,true); updatePosC(w,mid,tok,col,true); }
    else if(tp==='SELL') {
      w.sells++;w.grossOut+=col; tagPeriodC(w,ts,col,false); updatePosC(w,mid,tok,col,false);
      if(tok>0) { const p=col/tok; if(p>=0.5) w.profitableExits++; else w.unprofitableExits++; }
    }
  }
  return ws;
}
function aggregateClob(trades) {
  const ws = {};
  for (const t of trades) {
    for (const [af,sf] of [['maker_address','maker_side'],['taker_address','taker_side']]) {
      const addr=(t[af]||'').toLowerCase();
      if(!addr||addr==='0x'+'0'.repeat(40)) continue;
      if(!ws[addr]) ws[addr]=newW();
      const w=ws[addr]; w.trades++;
      const ts_raw=t.timestamp||t.created_at||0, ts=parseInt(ts_raw)||0;
      const price=parseFloat(t.price||0), size=parseFloat(t.size||0), cost=price*size;
      const side=(t[sf]||t.side||'').toUpperCase(), mid=t._market||'';
      if(ts){if(!w.firstTrade||ts<w.firstTrade)w.firstTrade=ts;if(!w.lastTrade||ts>w.lastTrade)w.lastTrade=ts;}
      if(side==='BUY') { w.buys++;w.grossIn+=cost; tagPeriodC(w,ts,cost,true); updatePosC(w,mid,size,cost,true); }
      else if(side==='SELL') {
        w.sells++;w.grossOut+=cost; tagPeriodC(w,ts,cost,false); updatePosC(w,mid,size,cost,false);
        if(price>=0.5) w.profitableExits++; else w.unprofitableExits++;
      }
    }
  }
  return ws;
}
function scoreWalletsC(ws) {
  const now=Math.floor(Date.now()/1000); const rows=[];
  for (const [addr,w] of Object.entries(ws)) {
    if(w.trades<MIN_TRADES) continue;
    const exits=w.profitableExits+w.unprofitableExits;
    const winRate=exits>0?(w.profitableExits/exits*100):0;
    const netPnl=w.grossOut-w.grossIn;
    const span=(w.firstTrade&&w.lastTrade)?(w.lastTrade-w.firstTrade):0;
    const activeDays=Math.max(1,Math.floor(span/86400));
    const lastAgo=w.lastTrade?Math.floor((now-w.lastTrade)/86400):9999;
    const pPnl={};
    for(const[p,pp] of Object.entries(w.periodPnl)) pPnl[p]=Math.round((pp.grossOut-pp.grossIn)*100)/100;
    rows.push({
      address:addr, trades:w.trades, buys:w.buys, sells:w.sells,
      winRate:Math.round(winRate*10)/10, profitableExits:w.profitableExits, totalExits:exits,
      netPnl:Math.round(netPnl*100)/100, grossIn:Math.round(w.grossIn*100)/100, grossOut:Math.round(w.grossOut*100)/100,
      activeDays, lastAgo, isActive:lastAgo<=ACT_WINDOW,
      periodFlags:w.periodFlags, periodScore:w.periodFlags.size, periodPnl:pPnl, positions:w.positions,
      latest_bets:[],
    });
  }
  return rows.sort((a,b)=>b.winRate-a.winRate||b.netPnl-a.netPnl);
}
function getMpC(rows) {
  return rows.filter(r=>[...REQ_PERIODS].every(p=>r.periodFlags.has(p))&&r.netPnl>0)
             .sort((a,b)=>b.periodScore-a.periodScore||b.netPnl-a.netPnl);
}
function getTop50C(rows) {
  return rows.filter(r=>r.isActive&&r.netPnl>0).sort((a,b)=>b.netPnl-a.netPnl).slice(0,TOP_PROFIT);
}

// ── Live prices ───────────────────────────────────────────────
async function enrichOdds(markets) {
  const open = markets.filter(m=>!m.closed&&!m.resolved);
  const results = await Promise.allSettled(open.map(async m => {
    let yesPrice=null;
    const pr=m.outcomePrices||[];
    if(pr.length) { const v=parseFloat(pr[0]); if(!isNaN(v)) yesPrice=v; }
    if(yesPrice===null) {
      const tids=(m.tokens||[]).map(t=>t.token_id||t.tokenId).filter(Boolean);
      if(tids.length) {
        try {
          const book=await apiFetch(`${CLOB}/book?token_id=${tids[0]}`);
          const bids=book?.bids||[];
          if(bids.length) yesPrice=parseFloat(bids[0].price);
        } catch(e){}
      }
    }
    return { title:m.question||m.title||m.slug||'?', yesPrice, volume:parseFloat(m.volume||m.volumeNum||0),
             marketId:m.conditionId||m.id||'', slug:m.slug||'' };
  }));
  return results.filter(r=>r.status==='fulfilled').map(r=>r.value);
}
function enrichBets(rows, openEnr) {
  const midMap={};
  for(const m of openEnr) midMap[m.marketId]=m;
  for(const row of rows) {
    const bets=[];
    for(const [mid,pos] of Object.entries(row.positions||{})) {
      const mkt=midMap[mid]; if(!mkt) continue;
      const nt=pos.netTokens||0, tc=pos.totalCost||0;
      const avg=nt>0?Math.round(tc/nt*10000)/10000:0;
      const cp=mkt.yesPrice;
      const up=cp!=null?Math.round((cp-avg)*nt*100)/100:null;
      bets.push({market_id:mid,market_title:mkt.title,tokens:Math.round(nt*100)/100,avg_price:avg,
                 cost:Math.round(tc*100)/100,current_price:cp,unrealized_pnl:up});
    }
    row.latest_bets=bets.sort((a,b)=>b.tokens-a.tokens);
  }
}

// ── Signals ───────────────────────────────────────────────────
function buildSignalsC(srcWallets, openMkts, label) {
  const sigs=[];
  for(const mkt of openMkts) {
    if(!mkt.marketId||mkt.yesPrice==null) continue;
    const holders=[];
    for(const w of srcWallets) {
      const pos=w.positions[mkt.marketId];
      if(!pos||pos.netTokens<=0.5) continue;
      const avg=pos.netTokens>0?pos.totalCost/pos.netTokens:mkt.yesPrice;
      holders.push({address:w.address,netTokens:Math.round(pos.netTokens*100)/100,avgEntry:Math.round(avg*10000)/10000,
                    netPnl:w.netPnl,winRate:w.winRate,periodScore:w.periodScore,period_flags:[...w.periodFlags]});
    }
    if(holders.length<MIN_SIG_WALL) continue;
    const tt=holders.reduce((s,h)=>s+h.netTokens,0);
    const tc=holders.reduce((s,h)=>s+h.avgEntry*h.netTokens,0);
    const avgEntry=tt>0?tc/tt:mkt.yesPrice;
    const avgPs=holders.reduce((s,h)=>s+h.periodScore,0)/holders.length;
    const p=mkt.yesPrice;
    const ev=SUCCESS_RATE*(1-p)-(1-SUCCESS_RATE)*p;
    const drift=avgEntry>0?Math.round((p/avgEntry-1)*1000)/10:0;
    const evSlip=SUCCESS_RATE*(1-p*1.02)-(1-SUCCESS_RATE)*(p*1.02);
    sigs.push({source:label,marketTitle:mkt.title,marketSlug:mkt.slug||'',yesPrice:p,volume:mkt.volume,
               walletCount:holders.length,avgEntryPrice:Math.round(avgEntry*10000)/10000,
               avgPeriodScore:Math.round(avgPs*10)/10,ev:Math.round(ev*10000)/10000,
               evSlippage:Math.round(evSlip*10000)/10000,driftPct:drift,
               wallets:holders.sort((a,b)=>b.netPnl-a.netPnl)});
  }
  return sigs.sort((a,b)=>b.avgPeriodScore-a.avgPeriodScore||b.walletCount-a.walletCount||b.ev-a.ev);
}
function allocateC(sigs) {
  const pos=sigs.filter(s=>s.ev>0);
  if(!pos.length) return [];
  pos.forEach(s=>{ const p=s.yesPrice,b=p>0?(1/p-1):0;
    const k=b>0?Math.max(0,(b*SUCCESS_RATE-(1-SUCCESS_RATE))/b):0;
    s.kellyFraction=Math.round(k*0.25*10000)/10000; });
  const tk=pos.reduce((a,s)=>a+s.kellyFraction,0);
  const scale=tk>0?Math.min(1,1/tk):1;
  pos.forEach(s=>{ s.allocation=Math.round(BUDGET*s.kellyFraction*scale*100)/100;
    s.shares=s.yesPrice>0?Math.round(s.allocation/s.yesPrice*10)/10:0;
    s.winPayout=Math.round(s.shares*100)/100; s.netProfit=Math.round((s.winPayout-s.allocation)*100)/100; });
  return pos;
}

// ── WebSocket price ticks ────────────────────────────────────
let _ws=null; let _wsTokenIds=[];
const _tokenToMid={};
function connectWS(markets) {
  const tids=[];
  for(const m of markets) {
    const mid=m.conditionId||m.id;
    for(const t of (m.tokens||[])) { const tid=t.token_id||t.tokenId; if(tid){tids.push(tid);_tokenToMid[tid]=mid;} }
  }
  if(!tids.length) return;
  _wsTokenIds=tids;
  if(_ws) { try{_ws.close();}catch(e){} }
  try {
    _ws=new WebSocket('wss://ws-subscriptions-clob.polymarket.com/ws/market');
    _ws.onopen=()=>_ws.send(JSON.stringify({auth:{},id:'1',markets:[],assets_ids:tids,type:'market'}));
    _ws.onmessage=(e)=>{
      try {
        const list=JSON.parse(e.data); const evs=Array.isArray(list)?list:[list];
        for(const m of evs) {
          if(m.asset_id&&m.price!=null) {
            const p=parseFloat(m.price); if(isNaN(p)) continue;
            const mid=_tokenToMid[m.asset_id]; if(!mid) continue;
            // Update openEnriched prices in DATA
            for(const coin of ['BTC','ETH','SOL']) {
              const oe=(DATA?.coins?.[coin]?.open_enriched||[]).find(o=>o.market_id===mid||o.marketId===mid);
              if(oe) { oe.yes_price=p; oe.yesPrice=p; }
            }
          }
        }
      } catch(ex){}
    };
    _ws.onerror=()=>{};
    _ws.onclose=()=>{ if(_wsTokenIds.length) setTimeout(()=>connectWS([]),8000); };
  } catch(ex){}
}

// ── Main live pipeline ───────────────────────────────────────
async function loadLive() {
  if(_liveLoading) return;
  _liveLoading=true;
  setStatus('loading', 'Fetching live market data…');
  try {
    // Fetch all 3 coins in parallel
    const [btcMkts,ethMkts,solMkts] = await Promise.all([
      fetchCoinMarkets('BTC'), fetchCoinMarkets('ETH'), fetchCoinMarkets('SOL')
    ]);
    const mktsPerCoin = {BTC:btcMkts, ETH:ethMkts, SOL:solMkts};
    setStatus('loading', `Markets loaded (${btcMkts.length}B/${ethMkts.length}E/${solMkts.length}S) — fetching trades…`);

    // All condition IDs (deduplicated)
    const allMids = [...new Set([...btcMkts,...ethMkts,...solMkts].map(m=>m.conditionId||m.id).filter(Boolean))];

    let trades = await fetchTrades(allMids).catch(()=>[]);
    if(!trades.length) {
      trades = await fetchTradesCLOB(allMids).catch(()=>[]);
    }
    setStatus('loading', `${trades.length} trades — analysing wallets…`);

    const isSubgraph = trades.length>0 && trades[0]?.creator;
    const allWs = isSubgraph ? aggregateSub(trades) : aggregateClob(trades);
    const allRows = scoreWalletsC(allWs);

    // Build per-coin data
    const coinsData = {};
    const allOpenEnr = [];
    const wsMarkets = [];

    for(const [coin, mkts] of Object.entries(mktsPerCoin)) {
      const coinMids = new Set(mkts.map(m=>m.conditionId||m.id).filter(Boolean));
      const coinRows = allRows.filter(r=>Object.keys(r.positions||{}).some(mid=>coinMids.has(mid)));
      const mpW  = getMpC(coinRows);
      const t50W = getTop50C(coinRows);

      setStatus('loading', `${coin}: fetching live prices…`);
      const openEnr = await enrichOdds(mkts).catch(()=>[]);
      allOpenEnr.push(...openEnr);
      wsMarkets.push(...mkts);
      enrichBets(coinRows, openEnr);

      const mpSigs  = allocateC(buildSignalsC(mpW,  openEnr.map(o=>({...o,marketId:o.marketId||o.market_id})), 'multi_period'));
      const t50Sigs = allocateC(buildSignalsC(t50W, openEnr.map(o=>({...o,marketId:o.marketId||o.market_id})), 'top50'));

      coinsData[coin] = {
        markets: mkts.map(m=>({id:m.conditionId||m.id,title:m.question||m.title||m.slug||'',
                               volume:parseFloat(m.volume||m.volumeNum||0),
                               closed:!!(m.closed||m.resolved),
                               yes_price:(m.outcomePrices||[]).length?parseFloat(m.outcomePrices[0]):null,
                               slug:m.slug||''})),
        open_enriched: openEnr.map(o=>({...o,market_id:o.marketId||o.market_id})),
        mp_wallets:  mpW.map(r=>({...r,period_flags:[...r.periodFlags],positions:r.positions})),
        top50:       t50W.map(r=>({...r,period_flags:[...r.periodFlags],positions:r.positions})),
        mp_signals:  mpSigs,
        t50_signals: t50Sigs,
        exit_signals:[],
      };
    }

    DATA = {
      generated_at: new Date().toISOString(),
      coins: coinsData,
      coin_meta: {BTC:{color:'#f7931a',icon:'₿'},ETH:{color:'#627eea',icon:'Ξ'},SOL:{color:'#9945ff',icon:'◎'}},
    };
    renderAll();
    setStatus('live', `Live · ${new Date().toLocaleTimeString()}`);
    connectWS(wsMarkets);
  } catch(err) {
    setStatus('error', 'Live fetch failed: '+err.message);
    console.error(err);
  } finally {
    _liveLoading=false;
  }
}

        </div>
        <div class="sig-m">
          <div class="val ${ev_col}">${ev_pct > 0 ? '+' : ''}${ev_pct}¢</div>
          <div class="lbl">EV (slip: ${(s.evSlippage*100).toFixed(1)}¢)</div>
        </div>
        <div class="sig-m">
          <div class="val ${drift_col}">${s.driftPct > 0 ? '+' : ''}${s.driftPct||0}%</div>
          <div class="lbl">Price Drift</div>
        </div>
      </div>
      <div class="sig-wallets">${walletRows}</div>
      <div class="sig-footer">
        <span>${age_str} &nbsp; ${s.walletCount} wallets · $${fmtNum(s.volume)} vol</span>
        <a class="sig-link" href="${polyUrl}" target="_blank">Polymarket ↗</a>
      </div>
      ${alloc ? `<div style="margin-top:8px">${alloc}</div>` : ''}
    </div>`;
  }).join('');

  return `<div class="signal-grid">${cards}</div>`;
}

// ── Exit alerts ─────────────────────────────────────────────
function renderExits(exits) {
  if (!exits.length) return `<div class="empty"><div class="icon">✅</div>No exit signals detected.</div>`;

  const cards = exits.map(e => {
    const polyUrl = e.marketSlug
      ? `https://polymarket.com/event/${e.marketSlug}` : '#';
    return `
    <div class="signal-card exit-sig">
      <div class="sig-top">
        <div class="sig-title">${esc(e.marketTitle)}</div>
        <span class="sig-badge ex">↓ Exit ${e.reductionPct}%</span>
      </div>
      <div class="sig-metrics">
        <div class="sig-m">
          <div class="val red">↓${e.reductionPct}%</div>
          <div class="lbl">Position Cut</div>
        </div>
        <div class="sig-m">
          <div class="val">${e.prevTokens} → ${e.currTokens}</div>
          <div class="lbl">Tokens</div>
        </div>
        <div class="sig-m">
          <div class="val ${e.walletPnl>=0?'green':'red'}">${e.walletPnl>=0?'+':''}$${Math.round(e.walletPnl)}</div>
          <div class="lbl">Wallet P&L</div>
        </div>
      </div>
      <div class="sig-footer">
        <span class="muted">${e.address.slice(0,8)}… · ${e.walletWinRate}% win · score ${e.periodScore}</span>
        <a class="sig-link" href="${polyUrl}" target="_blank">View ↗</a>
      </div>
    </div>`;
  }).join('');

  return `<div class="signal-grid">${cards}</div>`;
}

// ── Markets table ────────────────────────────────────────────
function renderMarketsTable(markets, coin) {
  if (!markets.length) return `<div class="empty">No open markets found.</div>`;

  const sorted = [...markets].sort((a,b) => (b.volume||0) - (a.volume||0));
  const rows   = sorted.slice(0,30).map(m => {
    const p    = m.yes_price;
    const pct  = p != null ? (p*100).toFixed(0) + '¢' : '—';
    const col  = p != null ? (p > 0.6 ? 'green' : p < 0.35 ? 'red' : 'yellow') : 'muted';
    const slug = m.slug || '';
    const url  = slug ? `https://polymarket.com/event/${slug}` : '#';
    const bar  = p != null ? `
      <div class="price-bar-wrap">
        <div style="font-size:11px" class="${col}">${pct}</div>
        <div class="price-bar">
          <div class="price-bar-fill" style="width:${(p*100).toFixed(0)}%;background:var(--${col === 'muted' ? 'border2' : col})"></div>
        </div>
      </div>` : `<span class="muted">—</span>`;

    return `<tr>
      <td style="max-width:260px;overflow:hidden;text-overflow:ellipsis">
        <a href="${url}" target="_blank" style="color:var(--text);text-decoration:none"
           onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--text)'">
          ${esc(m.title)}
        </a>
      </td>
      <td>${bar}</td>
      <td class="muted">$${fmtNum(m.volume||0)}</td>
    </tr>`;
  }).join('');

  return `<div class="tbl-wrap"><table>
    <thead><tr><th>Market</th><th>YES Price</th><th>Volume</th></tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

// ── Wallet table ─────────────────────────────────────────────
function renderWalletTable(wallets, key) {
  if (!wallets.length) return `<div class="empty">No wallets found.</div>`;

  const rows = wallets.slice(0,40).map((w, i) => {
    const pnl_col = w.net_pnl >= 0 ? 'green' : 'red';
    const pnl_str = (w.net_pnl >= 0 ? '+' : '') + '$' + Math.abs(Math.round(w.net_pnl));
    const addr_short = w.address.slice(0,6) + '…' + w.address.slice(-4);
    const ps_str = w.period_flags?.length > 0
      ? w.period_flags.map(p => ({jun_2025:"Jun'25",feb_2026:"Feb'26",mar_2026:"Mar'26"}[p]||p)).join(' ')
      : '—';
    const bets_html = (w.latest_bets||[]).slice(0,3).map(b => {
      const up  = b.unrealized_pnl;
      const col = up == null ? 'muted' : up >= 0 ? 'green' : 'red';
      const upStr = up == null ? '' : ` <span class="${col}">(${up>=0?'+':''}$${up})</span>`;
      return `<tr>
        <td style="color:var(--muted);max-width:200px;overflow:hidden;text-overflow:ellipsis">
          ${esc(b.market_title||b.market_id)}
        </td>
        <td>${b.tokens} tok @ ${(b.avg_price*100).toFixed(0)}¢</td>
        <td class="${col}">${b.current_price!=null?(b.current_price*100).toFixed(0)+'¢':'—'}${upStr}</td>
      </tr>`;
    }).join('');

    return `<tr id="wr-${key}-${i}">
      <td class="muted" style="font-size:11px">
        <a href="https://polygonscan.com/address/${w.address}" target="_blank"
           style="color:var(--muted);text-decoration:none"
           onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--muted)'"
        >${addr_short}</a>
      </td>
      <td class="${pnl_col}" style="font-weight:600">${pnl_str}</td>
      <td class="${w.win_rate >= 60 ? 'green' : w.win_rate >= 40 ? 'yellow' : 'red'}">${w.win_rate}%</td>
      <td class="muted">${w.trades}</td>
      <td class="muted" style="font-size:10px">${ps_str}</td>
      <td>
        ${bets_html ? `<button class="wallet-expand-btn" onclick="toggleBets('${key}',${i})">▶ bets</button>` : '<span class="muted">—</span>'}
      </td>
    </tr>
    <tr id="wb-${key}-${i}" style="display:none">
      <td colspan="6">
        <div class="wallet-detail">
          <table>
            <thead><tr><th>Market</th><th>Position</th><th>Current / Unrealized</th></tr></thead>
            <tbody>${bets_html}</tbody>
          </table>
        </div>
      </td>
    </tr>`;
  }).join('');

  return `<div class="tbl-wrap"><table>
    <thead><tr>
      <th>Address</th><th>Net P&L</th><th>Win%</th>
      <th>Trades</th><th>Periods</th><th>Live Bets</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

function toggleBets(key, i) {
  const row = document.getElementById(`wb-${key}-${i}`);
  const btn = document.querySelector(`#wr-${key}-${i} .wallet-expand-btn`);
  if (!row) return;
  const show = row.style.display === 'none';
  row.style.display = show ? '' : 'none';
  if (btn) btn.textContent = show ? '▼ bets' : '▶ bets';
}

// ── Copy signals ─────────────────────────────────────────────
function copyAllSignals() {
  if (!DATA?.coins) return;
  const lines = [];
  for (const coin of ['BTC','ETH','SOL']) {
    const cd = DATA.coins[coin] || {};
    const sigs = [...(cd.mp_signals||[]), ...(cd.t50_signals||[])];
    if (!sigs.length) continue;
    lines.push(`\n=== ${coin} Signals ===`);
    sigs.forEach(s => {
      const tag = s.source === 'multi_period' ? '★' : '·';
      lines.push(`${tag} ${s.marketTitle}`);
      lines.push(`  YES=${(s.yesPrice*100).toFixed(0)}¢  EV=${(s.ev*100).toFixed(1)}¢  Wallets=${s.walletCount}  Vol=$${fmtNum(s.volume)}`);
      if (s.allocation) lines.push(`  Kelly alloc: $${s.allocation} → $${s.winPayout}`);
    });
  }
  if (!lines.length) { showToast('No signals to copy'); return; }
  navigator.clipboard.writeText(lines.join('\n'))
    .then(() => showToast('Signals copied!'))
    .catch(() => showToast('Copy failed'));
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ── Helpers ─────────────────────────────────────────────────
function fmtNum(n) {
  if (n >= 1e6) return (n/1e6).toFixed(1) + 'M';
  if (n >= 1e3) return (n/1e3).toFixed(1) + 'K';
  return Math.round(n).toString();
}

function esc(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
          .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

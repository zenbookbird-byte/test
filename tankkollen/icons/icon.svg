<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00D9A3"/>
      <stop offset="100%" stop-color="#00B4FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#g)"/>
  <g transform="translate(128 96)" fill="#0A0E1A">
    <!-- fuel pump body -->
    <path d="M20 0 h150 a20 20 0 0 1 20 20 v280 a20 20 0 0 1 -20 20 h-150 a20 20 0 0 1 -20 -20 v-280 a20 20 0 0 1 20 -20 z"/>
    <!-- display window -->
    <rect x="25" y="40" width="140" height="80" rx="12" fill="#00D9A3"/>
    <!-- hose coil -->
    <rect x="25" y="150" width="140" height="16" rx="8" fill="#0A0E1A" opacity="0.0"/>
    <rect x="40" y="150" width="110" height="12" rx="6" fill="#00D9A3" opacity="0.5"/>
    <rect x="40" y="174" width="90" height="12" rx="6" fill="#00D9A3" opacity="0.3"/>
    <rect x="40" y="198" width="70" height="12" rx="6" fill="#00D9A3" opacity="0.2"/>
    <!-- right side nozzle arm -->
    <path d="M190 60 h35 a20 20 0 0 1 20 20 v145 a15 15 0 0 1 -15 15 h-5 v-40 a20 20 0 0 0 -20 -20 h-15 z" fill="#0A0E1A"/>
    <circle cx="232" cy="65" r="12" fill="#00D9A3"/>
  </g>
</svg>
